unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

set -g prefix C-s

bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

set-option -g status-position bottom

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "nordtheme/tmux"

# First start on a new machine: fetch TPM, load it, install the plugins above, reload.
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm' ; set -g @tpm-bootstrap 1"

run '~/.tmux/plugins/tpm/tpm'

if -F "#{@tpm-bootstrap}" \
  "run '~/.tmux/plugins/tpm/bin/install_plugins' ; set -gu @tpm-bootstrap ; source-file ~/.tmux.conf"
